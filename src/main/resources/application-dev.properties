# ===================================================================
# Zero-Config Development Profile (Runs out-of-the-box in VS Code)
# Uses H2 in MySQL Compatibility Mode
# ===================================================================

spring.datasource.url=jdbc:h2:mem:campusgig_db;DB_CLOSE_DELAY=-1;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Defer SQL script execution until Hibernate has created the schema tables
spring.jpa.defer-datasource-initialization=true

# Enable H2 Web Console at /h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# SQL Seed Data
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:database/data-dev.sql
