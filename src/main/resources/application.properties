# ===================================================================
# CampusGig Application Configuration
# ===================================================================

server.port=8080
server.servlet.context-path=/
spring.application.name=CampusGig

# Default Active Profile: 'dev' for zero-config (H2 with MySQL mode)
# Switch to 'mysql' when connecting to live MySQL 8.x
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Thymeleaf Configuration
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.servlet.produce-partial-output-while-processing=false

# Upload & Multipart Limits
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Logging Configuration
logging.level.org.springframework.security=INFO
logging.level.com.campusgig=INFO
