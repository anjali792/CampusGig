<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(~{::title}, ~{::section})}">
<head>
    <title>Sign Up - CampusGig</title>
</head>
<body>
<section class="py-12">
    <div class="max-w-xl mx-auto px-4 sm:px-6">
        <div class="bg-white rounded-3xl border border-slate-200 p-8 shadow-xl shadow-indigo-500/5">
            <!-- Header -->
            <div class="text-center mb-8">
                <div class="w-12 h-12 rounded-2xl gradient-brand text-white flex items-center justify-center text-xl mx-auto mb-3 shadow-md shadow-indigo-500/20">
                    <i class="fa-solid fa-user-plus"></i>
                </div>
                <h2 class="text-2xl font-bold text-slate-900 tracking-tight">Create Your CampusGig Account</h2>
                <p class="text-xs text-slate-500 mt-1">Join the hyper-local micro-internship marketplace today.</p>
            </div>

            <!-- Registration Form -->
            <form th:action="@{/register}" th:object="${userDto}" method="post" class="space-y-5" id="registerForm">
                <!-- Role Picker Tabs -->
                <div>
                    <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-2">I Want To</label>
                    <div class="grid grid-cols-2 gap-3">
                        <label class="cursor-pointer">
                            <input type="radio" th:field="*{role}" value="ROLE_STUDENT" class="peer sr-only" id="roleStudent" onchange="toggleRoleFields('ROLE_STUDENT')">
                            <div class="p-3.5 rounded-2xl border-2 border-slate-200 peer-checked:border-indigo-600 peer-checked:bg-indigo-50/50 text-center transition-all">
                                <i class="fa-solid fa-graduation-cap text-lg text-slate-500 peer-checked:text-indigo-600 block mb-1"></i>
                                <span class="text-xs font-bold text-slate-800 block">Work as Student</span>
                                <span class="text-[10px] text-slate-500 block">Apply for micro-gigs</span>
                            </div>
                        </label>

                        <label class="cursor-pointer">
                            <input type="radio" th:field="*{role}" value="ROLE_CLIENT" class="peer sr-only" id="roleClient" onchange="toggleRoleFields('ROLE_CLIENT')">
                            <div class="p-3.5 rounded-2xl border-2 border-slate-200 peer-checked:border-indigo-600 peer-checked:bg-indigo-50/50 text-center transition-all">
                                <i class="fa-solid fa-briefcase text-lg text-slate-500 peer-checked:text-indigo-600 block mb-1"></i>
                                <span class="text-xs font-bold text-slate-800 block">Hire as Client</span>
                                <span class="text-[10px] text-slate-500 block">Post tasks & hire students</span>
                            </div>
                        </label>
                    </div>
                </div>

                <!-- Common: Full Name & Email -->
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label for="fullName" class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1">Full Name</label>
                        <input type="text" th:field="*{fullName}" id="fullName" required
                               class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 text-sm focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500"
                               placeholder="e.g. Alex Rivera">
                        <p th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}" class="text-rose-500 text-xs mt-1"></p>
                    </div>

                    <div>
                        <label for="email" class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1">Email</label>
                        <input type="email" th:field="*{email}" id="email" required
                               class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 text-sm focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500"
                               placeholder="alex@campus.edu">
                        <p th:if="${#fields.hasErrors('email')}" th:errors="*{email}" class="text-rose-500 text-xs mt-1"></p>
                    </div>
                </div>

                <!-- Phone -->
                <div>
                    <label for="phone" class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1">Phone Number (Optional)</label>
                    <input type="text" th:field="*{phone}" id="phone"
                           class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 text-sm focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500"
                           placeholder="+1 (555) 000-0000">
                </div>

                <!-- STUDENT SPECIFIC FIELDS -->
                <div id="studentFields" class="space-y-4 pt-2 border-t border-slate-100">
                    <p class="text-xs font-semibold text-indigo-700 uppercase tracking-wider flex items-center">
                        <i class="fa-solid fa-id-card mr-1.5"></i> Academic Profile Details
                    </p>

                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <div>
                            <label for="college" class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1">College / University</label>
                            <input type="text" th:field="*{college}" id="college"
                                   class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 text-sm focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500"
                                   placeholder="e.g. State Tech University">
                        </div>
                        <div>
                            <label for="major" class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1">Major / Degree</label>
                            <input type="text" th:field="*{major}" id="major"
                                   class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 text-sm focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500"
                                   placeholder="e.g. Computer Science">
                        </div>
                    </div>

                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <div>
                            <label for="graduationYear" class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1">Graduation Year</label>
                            <input type="number" th:field="*{graduationYear}" id="graduationYear" min="2024" max="2032"
                                   class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 text-sm focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500"
                                   placeholder="2026">
                        </div>
                        <div>
                            <label for="skillsTags" class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1">Skills Tags (Comma-separated)</label>
                            <input type="text" th:field="*{skillsTags}" id="skillsTags"
                                   class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 text-sm focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500"
                                   placeholder="Java, Python, React, Tailwind, Figma">
                        </div>
                    </div>
                </div>

                <!-- CLIENT SPECIFIC FIELDS -->
                <div id="clientFields" class="space-y-4 pt-2 border-t border-slate-100 hidden">
                    <p class="text-xs font-semibold text-blue-700 uppercase tracking-wider flex items-center">
                        <i class="fa-solid fa-building mr-1.5"></i> Organization / Hiring Entity
                    </p>

                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <div>
                            <label for="companyName" class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1">Company / Organization / Club Name</label>
                            <input type="text" th:field="*{companyName}" id="companyName"
                                   class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 text-sm focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500"
                                   placeholder="e.g. Apex Cafe / AI Club">
                        </div>
                        <div>
                            <label for="organizationType" class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1">Organization Type</label>
                            <select th:field="*{organizationType}" id="organizationType"
                                    class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 text-sm focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 bg-white">
                                <option value="Startup">Tech Startup</option>
                                <option value="Local Business">Local Business</option>
                                <option value="College Club Lead">College Club / Student Society</option>
                                <option value="Individual Client">Individual Client</option>
                            </select>
                        </div>
                    </div>

                    <div>
                        <label for="websiteUrl" class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1">Website or Social URL</label>
                        <input type="url" th:field="*{websiteUrl}" id="websiteUrl"
                               class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 text-sm focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500"
                               placeholder="https://mycompany.com">
                    </div>
                </div>

                <!-- Password and Confirm Password -->
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 pt-2 border-t border-slate-100">
                    <div>
                        <label for="password" class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1">Password</label>
                        <input type="password" th:field="*{password}" id="password" required minlength="6"
                               class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 text-sm focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500"
                               placeholder="At least 6 characters">
                        <p th:if="${#fields.hasErrors('password')}" th:errors="*{password}" class="text-rose-500 text-xs mt-1"></p>
                    </div>

                    <div>
                        <label for="confirmPassword" class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1">Confirm Password</label>
                        <input type="password" th:field="*{confirmPassword}" id="confirmPassword" required
                               class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 text-sm focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500"
                               placeholder="Re-enter password">
                        <p th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}" class="text-rose-500 text-xs mt-1"></p>
                    </div>
                </div>

                <div class="pt-4">
                    <button type="submit" class="w-full py-3 px-4 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold rounded-xl text-sm shadow-md shadow-indigo-500/20 transition-all">
                        Create Account
                    </button>
                </div>
            </form>

            <div class="mt-6 text-center text-xs text-slate-600">
                Already have an account? 
                <a th:href="@{/login}" class="font-semibold text-indigo-600 hover:text-indigo-700 ml-1">Sign in here</a>
            </div>
        </div>
    </div>
</section>

<script>
    function toggleRoleFields(role) {
        const studentFields = document.getElementById('studentFields');
        const clientFields = document.getElementById('clientFields');
        if (role === 'ROLE_CLIENT') {
            studentFields.classList.add('hidden');
            clientFields.classList.remove('hidden');
        } else {
            studentFields.classList.remove('hidden');
            clientFields.classList.add('hidden');
        }
    }

    // Initialize state on load
    document.addEventListener('DOMContentLoaded', () => {
        const isClient = document.getElementById('roleClient').checked;
        toggleRoleFields(isClient ? 'ROLE_CLIENT' : 'ROLE_STUDENT');
    });
</script>
</body>
</html>
