<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(~{::title}, ~{::section})}">
<head>
    <title>Log In - CampusGig</title>
</head>
<body>
<section class="py-16">
    <div class="max-w-md mx-auto px-4 sm:px-6">
        <!-- Card Container -->
        <div class="bg-white rounded-3xl border border-slate-200 p-8 shadow-xl shadow-indigo-500/5">
            <!-- Header -->
            <div class="text-center mb-8">
                <div class="w-12 h-12 rounded-2xl gradient-brand text-white flex items-center justify-center text-xl mx-auto mb-3 shadow-md shadow-indigo-500/20">
                    <i class="fa-solid fa-lock"></i>
                </div>
                <h2 class="text-2xl font-bold text-slate-900 tracking-tight">Welcome Back</h2>
                <p class="text-xs text-slate-500 mt-1">Log in to manage your micro-internships, applications, or student profile.</p>
            </div>

            <!-- Login Form -->
            <form th:action="@{/login}" method="post" class="space-y-4">
                <div>
                    <label for="email" class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1">Email Address</label>
                    <div class="relative">
                        <i class="fa-solid fa-envelope absolute left-3.5 top-3.5 text-slate-400 text-sm"></i>
                        <input type="email" id="email" name="email" required autofocus
                               class="w-full pl-10 pr-4 py-2.5 rounded-xl border border-slate-300 text-sm focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition-colors"
                               placeholder="aryan.student@campus.edu">
                    </div>
                </div>

                <div>
                    <div class="flex justify-between items-center mb-1">
                        <label for="password" class="block text-xs font-semibold text-slate-700 uppercase tracking-wider">Password</label>
                    </div>
                    <div class="relative">
                        <i class="fa-solid fa-key absolute left-3.5 top-3.5 text-slate-400 text-sm"></i>
                        <input type="password" id="password" name="password" required
                               class="w-full pl-10 pr-4 py-2.5 rounded-xl border border-slate-300 text-sm focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition-colors"
                               placeholder="••••••••">
                    </div>
                </div>

                <div class="pt-2">
                    <button type="submit" class="w-full py-3 px-4 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold rounded-xl text-sm shadow-md shadow-indigo-500/20 transition-all">
                        Sign In to CampusGig
                    </button>
                </div>
            </form>

            <!-- Quick Demo Fill Helpers -->
            <div class="mt-8 pt-6 border-t border-slate-200">
                <p class="text-xs font-semibold text-slate-500 uppercase tracking-wider text-center mb-3">
                    <i class="fa-solid fa-bolt text-amber-500 mr-1"></i> Quick 1-Click Demo Logins
                </p>
                <div class="grid grid-cols-2 gap-2 text-xs">
                    <button type="button" onclick="fillDemoCredentials('aryan.student@campus.edu', 'Student')"
                            class="p-2.5 rounded-xl border border-indigo-200 bg-indigo-50/50 hover:bg-indigo-100/60 text-indigo-800 text-left transition-colors">
                        <span class="font-bold block">👤 Aryan (Student)</span>
                        <span class="text-[10px] text-indigo-600 truncate block">aryan.student@campus.edu</span>
                    </button>

                    <button type="button" onclick="fillDemoCredentials('kunal@innovatex.in', 'Client')"
                            class="p-2.5 rounded-xl border border-blue-200 bg-blue-50/50 hover:bg-blue-100/60 text-blue-800 text-left transition-colors">
                        <span class="font-bold block">💼 Kunal (Client)</span>
                        <span class="text-[10px] text-blue-600 truncate block">kunal@innovatex.in</span>
                    </button>
                </div>
                <p class="text-[11px] text-slate-400 text-center mt-2 font-mono">Password for test accounts: password123</p>
            </div>

            <!-- Footer note -->
            <div class="mt-6 text-center text-xs text-slate-600">
                Don't have an account yet? 
                <a th:href="@{/register}" class="font-semibold text-indigo-600 hover:text-indigo-700 ml-1">Create one free</a>
            </div>
        </div>
    </div>
</section>
</body>
</html>
